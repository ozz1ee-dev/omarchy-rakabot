name: checks

on:
  push:
  pull_request:

# Least privilege: the checks below only read the repository.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to a full commit SHA, never a mutable
      # major tag: `@v5` can be repointed at different code and would then run
      # in this repository's CI. The version comment is for humans.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: watcher and setup tests
        run: python3 -B -m unittest discover -s tests -v

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: avatar hash parity with Rakazo
        run: python3 scripts/check-persona-parity.py --require-node

  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: manifest contract
        run: python3 scripts/check-manifest.py .

  ascii:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: text files are ASCII
        # QML is deliberately not in this list: the widget draws real glyphs
        # (the middle dot, the ellipsis, the return arrow) as part of its design.
        run: |
          set -euo pipefail
          files=$(git ls-files '*.md' '*.py' '*.json' '*.yml' '*.sh')
          if LC_ALL=C grep -nP '[^\x00-\x7F]' $files; then
            echo "non-ASCII characters found in the lines above"
            exit 1
          fi
          echo "all tracked text files are ASCII"
